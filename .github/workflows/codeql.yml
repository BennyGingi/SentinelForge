name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches new CodeQL query-pack findings against unchanged code -- a
    # weekly cadence, not on every push, since nothing about the source
    # changes between pushes to justify a daily re-scan.
    - cron: "17 3 * * 1"

jobs:
  analyze:
    name: Analyze (C++)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp

      # Manual build, scoped to collector-cpp only: it's the network-facing,
      # security-relevant component (parses attacker-controlled telemetry,
      # serves the HTTP API) and already builds cleanly on Linux -- the same
      # recipe docker/collector.Dockerfile uses. gui/ needs a Qt6 toolchain
      # CodeQL gains little from analyzing here; add it later if that
      # changes.
      - name: Build collector-cpp
        run: |
          cmake -S collector-cpp -B collector-cpp/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build collector-cpp/build --config Release --target collector --parallel

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"

      # First pass (Issue #046): reports findings, does not fail the job.
      # Reuses this job's Linux build rather than standing up a dedicated
      # Linux CI leg (that's its own backlog item) since compile_commands.json
      # export needs a Makefile/Ninja generator -- the Windows CI job's
      # Visual Studio generator can't produce one.
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-tidy

      - name: clang-tidy (non-blocking)
        continue-on-error: true
        run: |
          : > clang-tidy-report.txt
          for f in collector-cpp/src/*.cpp; do
            clang-tidy -p collector-cpp/build "$f" 2>&1 | tee -a clang-tidy-report.txt
          done

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
