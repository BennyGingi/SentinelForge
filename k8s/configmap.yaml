apiVersion: v1
data:
  mimikatz_execution.json: "{\r\n    \"rule_name\": \"Mimikatz Execution\",\r\n    \"process_name\":
    \"powershell.exe\",\r\n    \"command_line_contains\": \"mimikatz\",\r\n    \"severity\":
    \"Critical\",\r\n    \"mitre\": \"T1003\"\r\n}\r\n"
  suspicious_cmd_whoami.json: "{\r\n    \"rule_name\": \"Suspicious Whoami via cmd.exe\",\r\n
    \   \"process_name\": \"cmd.exe\",\r\n    \"command_line_contains\": \"whoami\",\r\n
    \   \"severity\": \"Medium\",\r\n    \"mitre\": \"T1033\"\r\n}\r\n"
  suspicious_powershell.json: |
    {
        "rule_name": "Suspicious PowerShell",
        "process_name": "powershell.exe",
        "command_line_contains": "-enc",
        "severity": "High",
        "mitre": "T1059.001"
    }
kind: ConfigMap
