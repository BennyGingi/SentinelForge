---
apiVersion: v1
data:
  certutil_lolbin_download.yml: |
    title: Certutil Remote Payload Download
    id: a1c40021
    status: experimental
    description: >
      certutil.exe invoked with a URL in its command line. Legitimate certutil
      usage (cert import/export, hashing, cert-store inspection) operates on
      local files or store names and essentially never contains a URL; the
      presence of one is a strong behavioral indicator of certutil being abused
      as a LOLBin to fetch a remote payload (classic `-urlcache -f <url> <out>`
      or the less common `-verifyctl -f <url> <out>` form), rather than a
      literal match on one specific flag.
    author: SentinelForge
    falsepositives:
      - Legitimate certutil operations that reference a CRL/OCSP responder URL
        during certificate validation (uncommon in day-to-day admin use, but
        real — investigate the destination and downloaded file before acting).
      - Automated cert-provisioning scripts that happen to pass a URL as part
        of a store name or comment field.

    logsource:
      category: process_creation
      product: windows

    detection:
      selection:
        process_name: certutil.exe
        command_line|contains: "http"
      condition: selection

    level: medium

    tags:
      - attack.command_and_control
      - attack.t1105
      - attack.t1218.011

    # --- Phase 1 translator coverage note --------------------------------------
    # The rule above is the Phase-1-executable form: one selection, one
    # process_name, one command_line|contains. It intentionally matches on the
    # URL behavior rather than enumerating flags, so it already tolerates
    # argument reordering and spacing around -urlcache/-verifyctl without
    # needing OR logic.
    #
    # A more surgical version would flag on the *flag* rather than the URL
    # generically:
    #
    #   detection:
    #     selection_urlcache:
    #       process_name: certutil.exe
    #       command_line|contains: '-urlcache'
    #     selection_verifyctl:
    #       process_name: certutil.exe
    #       command_line|contains: '-verifyctl'
    #     condition: 1 of selection*
    #
    # collector-cpp's SigmaParser only recognizes a single map named exactly
    # `selection` (SigmaParser.cpp: `if (!detection["selection"] ...)`) and only
    # reads `condition: selection` (any other value is rejected: "Unsupported
    # condition '<x>' (Phase 1 supports only 'selection')"). Named/multiple
    # selections and `1 of selection*` are not supported at all — confirmed by
    # attempting to load this exact block, which SigmaLoader rejects outright.
    # Until that lands, multi-form Sigma rules either collapse onto one
    # behavioral indicator (as above) or split into separate rule files per
    # process_name, since process_name is also single-value-exact-match only
    # (no OR across binaries, e.g. certutil.exe vs bitsadmin.exe, either).
  sc_service_creation.yml: |
    title: Suspicious Service Creation via sc.exe
    id: b3e91177
    status: experimental
    description: >
      sc.exe invoked with the "create" verb — a new Windows service being
      registered. Matches the subcommand itself rather than any specific
      service name or binary path, so it's robust to naming/argument variation
      and doesn't require an OR condition to catch different attacker-chosen
      service names.
    author: SentinelForge
    falsepositives:
      - Very common. Nearly every Windows service installer, patch/update
        agent, and IT management tool (SCCM, Chocolatey, MSI custom actions,
        driver installers) calls `sc.exe create` directly as part of normal
        software installation. This rule is a starting point for
        investigation — host, parent process, binary path, and whether the
        service was expected on that host — not a standalone verdict.
      - Legitimate administrators scripting service deployment via sc.exe
        instead of PowerShell's `New-Service`.

    logsource:
      category: process_creation
      product: windows

    detection:
      selection:
        process_name: sc.exe
        command_line|contains: "create"
      condition: selection

    level: medium

    tags:
      - attack.persistence
      - attack.privilege_escalation
      - attack.t1543.003

    # --- Phase 1 translator coverage note --------------------------------------
    # Single selection, single process_name, single command_line|contains — the
    # only shape collector-cpp's Phase-1 SigmaParser/SigmaTranslator execute
    # today (see SigmaParser.cpp ReadSelection: only `process_name` and
    # `command_line|contains`/`command_line` are read; every other field or
    # modifier is silently ignored, not merely unsupported-but-warned-about).
    #
    # Two things a fuller rule would want that Phase 1 cannot express:
    #   1. Excluding sc.exe binPath values pointing at Program Files / signed
    #      vendor installers to cut the false-positive rate (`command_line|
    #      contains|all`, a `not` condition, or a second selection with a
    #      `filter` — none of the `and`/`or`/`not` condition grammar exists;
    #      condition must be the literal string "selection").
    #   2. OR'ing "create" with "config" (reconfiguring an existing service's
    #      binPath is an equally valid T1543.003 persistence technique) — same
    #      multi-selection limitation documented in
    #      certutil_lolbin_download.yml, empirically confirmed there by
    #      attempting to load a `1 of selection*` rule and observing SigmaLoader
    #      reject it with "Missing required field: selection" and "Unsupported
    #      condition".
  suspicious_encoded_powershell.yml: "title: Suspicious Encoded PowerShell\r\nid:
    8d2b1234\r\nstatus: experimental\r\ndescription: Detect encoded PowerShell\r\nauthor:
    SentinelForge\r\nfalsepositives:\r\n  - Admin scripts\r\nlogsource:\r\n  category:
    process_creation\r\n  product: windows\r\n\r\ndetection:\r\n  selection:\r\n    process_name:
    powershell.exe\r\n    command_line|contains: \"-enc\"\r\n  condition: selection\r\n\r\nlevel:
    high\r\n\r\ntags:\r\n  - attack.execution\r\n  - attack.t1059.001\r\n"
kind: ConfigMap
metadata:
  name: collector-sigma-rules
  namespace: sentinelforge
